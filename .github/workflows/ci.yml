# TODO (F): must check 3 areas — code quality, data validity, model quality gate
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check src tests
      - run: pytest -q
        env: { PYTHONPATH: src }

  data-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m demand.data.schema --sample tests/fixtures/sample_train.csv
        env: { PYTHONPATH: src }

  model-gate:
    needs: [code-quality, data-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m demand.training.gating --ci --sample tests/fixtures/sample_train.csv
        env: { PYTHONPATH: src }
